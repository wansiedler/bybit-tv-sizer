# Single tool in place of flake8 + black + isort.
# The image runs python:3.14-slim; CI tests 3.12 through 3.14. The target
# stays at the oldest supported version so nothing newer sneaks in.
target-version = "py312"
line-length = 100

exclude = [".git", "__pycache__", ".venv", "session", "build", "dist"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (line-length owns this)
]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.isort]
known-first-party = ["parser", "relay", "chat_id", "setup_env"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
