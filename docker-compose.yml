services:
  relay:
    build: .
    image: lexx-relay
    container_name: lexx-relay
    restart: unless-stopped
    # SIGTERM -> relay posts its shutdown notice before exiting.
    stop_grace_period: 30s
    env_file: bipboop
    environment:
      SESSION_NAME: /app/session/lexx_relay
      # SPEAK_HOURS is wall-clock time; without this the container sits in
      # UTC and speaks two hours late.
      TZ: ${TZ:-Europe/Berlin}
    # The Nest fetches the spoken alert from here, so this has to be reachable
    # on the LAN — not just on localhost.
    ports:
      - "${TTS_PORT:-8422}:${TTS_PORT:-8422}"
      # TradingView webhook receiver; harmless while TV_WEBHOOK_SECRET is empty.
      # Loopback only: cloudflared on the host is what the internet talks to.
      # A router port-forward instead needs TV_BIND=0.0.0.0.
      - "${TV_BIND:-127.0.0.1}:${TV_PORT:-8423}:${TV_PORT:-8423}"
    volumes:
      - ./session:/app/session
    # First run needs a terminal for the Telegram login code:
    #   docker compose run --rm relay python relay.py --check
    stdin_open: true
    tty: true
