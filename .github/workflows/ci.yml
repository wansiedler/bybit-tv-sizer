name: CI

# The runner is pinned, not `ubuntu-latest`: that label migrates to Ubuntu 26
# on 2026-10-19, and this pipeline builds the image that runs on the host
# holding the exchange keys — the base moving under it is a change to make on
# purpose, with a diff, not one to discover from a red run one morning.
# Dependabot watches github-actions here and will propose the next one.
#
# Gating model, borrowed from the org pipelines:
#   * hooks over CHANGED files are the blocking gate — new code must be clean,
#     pre-existing debt in untouched files cannot red a PR;
#   * the whole-tree pass is informational drift radar;
#   * tests, actionlint and the image build are hard gates;
#   * Trivy is a hard gate, except the Security-tab push (needs Advanced
#     Security, which a private repo may not have).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  #  Quality: pre-commit hook suite (ruff, mypy, bandit, yamllint, ...) #
  # ------------------------------------------------------------------ #
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0   # the diff gate needs the merge-base with the base ref
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install toolchain
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements-ci.lock

      # A manifest that names a version the lock does not carry is a manifest
      # nothing reads: every job and the image install from the .lock.
      # Dependabot edits the .txt and never the .lock, so without this the two
      # drift apart silently — ruff was declared 0.16.7 while 0.16.4 ran for
      # weeks, and telethon was declared >=1.45.0 while the image shipped
      # 1.44.0. Blocking: a lie in a manifest is not a style nit.
      - name: Manifests match their locks (blocking)
        run: |
          python3 - <<'EOF'
          import re
          import sys

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import InvalidVersion, Version

          PAIRS = [
              ("requirements.txt", "requirements.lock"),
              (".github/requirements-ci.txt", ".github/requirements-ci.lock"),
              (".github/requirements-radar.txt", ".github/requirements-radar.lock"),
          ]
          LOCKED = re.compile(r"^(?P<name>[A-Za-z0-9._-]+)==(?P<ver>[^\s\\;]+)")

          def read(path):
              try:
                  return open(path, encoding="utf-8").read().split("\n")
              except OSError:
                  return None

          bad, checked = [], 0
          for txt_path, lock_path in PAIRS:
              txt, lock = read(txt_path), read(lock_path)
              if txt is None or lock is None:
                  continue
              locked = {}
              for line in lock:
                  m = LOCKED.match(line.strip())
                  if m:
                      locked[canonicalize_name(m["name"])] = m["ver"]
              for line in txt:
                  line = line.strip()
                  if not line or line.startswith(("#", "-")):
                      continue
                  try:
                      req = Requirement(line)
                  except Exception:
                      continue
                  checked += 1
                  have = locked.get(canonicalize_name(req.name))
                  if have is None:
                      bad.append(f"`{txt_path}`: **{req.name}** is declared but absent from `{lock_path}`")
                      continue
                  if not req.specifier:
                      continue
                  # Satisfaction, not presence: Dependabot moves the floor in
                  # the .txt, and "the package is in the lock" is exactly the
                  # answer that misses that.
                  try:
                      ok = Version(have) in req.specifier
                  except InvalidVersion:
                      continue
                  if not ok:
                      bad.append(f"`{txt_path}`: **{req.name}{req.specifier}** but `{lock_path}` pins **{have}**")

          import os
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          if bad:
              print("## \u274c Manifest and lock disagree", file=out)
              print("", file=out)
              for b in bad:
                  print(f"- {b}", file=out)
              print("", file=out)
              print("The install reads the lock, so the manifest is the one being ignored.", file=out)
              print("Regenerate: `uv pip compile <txt> --generate-hashes --python-version 3.12 -o <lock>`", file=out)
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)
          print(f"## \u2705 Every manifest pin is satisfied by its lock ({checked} requirements)", file=out)
          EOF

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Commit style over the PR's own range. The commitizen hook in
      # .pre-commit-config.yaml is stages: [commit-msg]: it guards a local
      # `git commit`, and only once `pre-commit install --hook-type commit-msg`
      # has been run — `pre-commit run --all-files` below never executes it.
      # Informational: history is fixed by a rebase, and a non-conventional
      # subject is not a reason to block a merge.
      - name: Commit style (commitizen)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess

          base = os.environ.get("BASE_SHA", "")
          os.makedirs("ci-metrics", exist_ok=True)
          out = {}

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).stdout

          if not base:
              out = {"commitstyle_skipped": "no base sha on the event"}
          else:
              rng = f"{base}..HEAD"
              # Merges carry git's own "Merge branch …" subject and are not
              # judged, but they are counted so the total reconciles with the
              # commit count GitHub shows on the PR.
              merges = len([x for x in git("log", "--merges", "--format=%H", rng).split() if x])
              shas = [x for x in git("log", "--no-merges", "--format=%H", rng).split() if x]
              judged, bad = [], []
              for sha in shas:
                  msg = git("log", "-1", "--format=%B", sha)
                  row = {"sha": sha[:7], "subject": msg.split("\n")[0].strip()}
                  judged.append(row)
                  # The hook itself is the authority, invoked through
                  # pre-commit rather than a `cz` of our own: that way the rev
                  # in .pre-commit-config.yaml is the single pin, CI judges a
                  # commit with exactly the version the author's commit-msg
                  # hook would, and there is no second pin for dependabot to
                  # drift out of lockstep.
                  with open("cz-msg.txt", "w") as f:
                      f.write(msg)
                  rc = subprocess.run(
                      ["pre-commit", "run", "commitizen",
                       "--hook-stage", "commit-msg",
                       "--commit-msg-filename", "cz-msg.txt"],
                      capture_output=True, text=True).returncode
                  if rc != 0:
                      bad.append(row)
              if not judged:
                  out = {"commitstyle_skipped": "no non-merge commit in the range",
                         "commitstyle_merges": merges}
              else:
                  out = {"commitstyle_total": len(judged), "commitstyle_merges": merges,
                         "commitstyle_commits": judged[:50]}
                  if bad:
                      out["commitstyle_bad"] = bad

          json.dump(out, open("ci-metrics/commitstyle.json", "w"))
          bad_n = len(out.get("commitstyle_bad") or [])
          total = out.get("commitstyle_total", 0)
          if out.get("commitstyle_skipped"):
              line = f"## ⏭️ Commit style: {out['commitstyle_skipped']}"
          elif bad_n:
              line = f"## ⚠️ Commit style: {bad_n}/{total} not conventional"
          else:
              line = f"## ✅ Commit style: {total}/{total} conventional"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              print(line, file=f)
              for c in (out.get("commitstyle_bad") or [])[:20]:
                  print(f"- `{c['sha']}` {c['subject']}", file=f)
          EOF

      # ---- THE blocking gate: changed files only ----
      - name: Lint changed code (blocking)
        env:
          SKIP: no-commit-to-branch   # CI runs on main; the hook guards humans
        run: |
          # A PR diffs against its base. A push diffs against what was there
          # before it — comparing main to main would gate on an empty diff and
          # wave everything through. Falls back to HEAD^ when the event carries
          # no "before" (a brand new branch, or a local act run).
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="${{ github.event.before }}"
          case "$BASE" in
            "" | 0000000000000000000000000000000000000000)
              BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
              ;;
          esac
          FROM=$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")
          echo "diffing $FROM..HEAD"
          set +e
          out=$(pre-commit run --color never --from-ref "$FROM" --to-ref HEAD 2>&1)
          rc=$?
          set -e
          echo "$out"
          # Kept for the metrics step: the CI report turns each failed hook into
          # a row, and a variable does not survive the step boundary.
          printf '%s\n' "$out" > hooks-gate.log
          if [ "$rc" -ne 0 ]; then
            {
              echo "## ❌ Diff gate (blocking)"
              echo ""
              echo '```'
              grep -vE "Passed$|Skipped$" <<< "$out" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          echo "## ✅ Diff gate: clean" >> "$GITHUB_STEP_SUMMARY"

      # ---- whole-tree pass: informational ----
      - name: Full-tree hooks (blocking)
        if: ${{ !cancelled() }}
        env:
          SKIP: no-commit-to-branch
        run: |
          set +e
          out=$(pre-commit run --all-files --color never 2>&1)
          rc=$?
          set -e
          echo "$out"
          printf '%s\n' "$out" > hooks-tree.log
          if [ "$rc" -ne 0 ]; then
            findings=$(grep -vE "Passed$|Skipped$" <<< "$out" || true)
            {
              echo "## ❌ Full-tree hooks"
              echo ""
              echo '```'
              head -n 120 <<< "$findings"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          echo "## ✅ Full-tree hooks: clean" >> "$GITHUB_STEP_SUMMARY"

      # ci-metrics contract for the CI report: one row per FAILED hook, so the
      # PR comment names what to fix instead of pointing at the job log.
      - name: Metrics for the CI report
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import json, os, re

          # "ruff....................Failed" — pre-commit pads the name with dots.
          HEAD = re.compile(r"^(?P<name>.+?)\.{3,}(?P<status>Passed|Failed|Skipped|No files to check)", re.I)

          def hooks(path):
              """[{hook, lines, first}] for every hook that failed."""
              try:
                  raw = open(path, encoding="utf-8", errors="replace").read().split("\n")
              except OSError:
                  return None
              out, cur = [], None
              for line in raw:
                  m = HEAD.match(line)
                  if m:
                      cur = {"hook": m["name"].strip(), "body": []} if m["status"].lower() == "failed" else None
                      if cur:
                          out.append(cur)
                      continue
                  # "- hook id: x" / "- exit code: 1" are plumbing, not findings.
                  if cur is not None and line.strip() and not line.startswith("- "):
                      cur["body"].append(line.rstrip())
              return [{"hook": h["hook"], "lines": len(h["body"]),
                       "first": (h["body"][0] if h["body"] else "")[:300]} for h in out]

          metrics, findings, degraded = {}, {}, []
          for path, key, what in (("hooks-gate.log", "hooks_gate", "the blocking diff gate"),
                                  ("hooks-tree.log", "hooks", "the full-tree pass")):
              rows = hooks(path)
              if rows is None:
                  # No log at all: the step died before pre-commit spoke. A missing
                  # section would read as "clean" — say it was not run instead.
                  degraded.append(f"pre-commit ({what}): no output captured — the step failed before the hooks ran")
                  continue
              metrics[key] = len(rows)
              if rows:
                  findings[key] = rows[:50]
          if degraded:
              findings["radar_degraded"] = degraded
          metrics["findings"] = findings
          os.makedirs("ci-metrics", exist_ok=True)
          json.dump(metrics, open("ci-metrics/hooks.json", "w"))
          EOF

      - name: Upload metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: ci-metrics-hooks
          path: ci-metrics/
          retention-days: 7

  # ------------------------------------------------------------------ #
  #  Tests: the parser is the part with logic worth pinning down        #
  # ------------------------------------------------------------------ #
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what the image actually runs; the rest is the supported floor.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          # pyaes (telethon dep) publishes no wheel; its sdist stays hash-pinned.
          pip install --require-hashes --only-binary :all: --no-binary pyaes -r requirements.lock
          pip install --require-hashes --only-binary :all: -r .github/requirements-ci.lock

      - name: pytest with coverage
        run: |
          set +e
          # --junitxml: the CI report names the failing tests, and parsing the
          # terminal output for them is guesswork.
          out=$(pytest --cov --cov-report=term-missing --cov-report=xml --color=no --junitxml=junit.xml 2>&1)
          rc=$?
          set -e
          echo "$out"
          {
            echo "## $([ $rc -eq 0 ] && echo '✅' || echo '❌') pytest (py${{ matrix.python-version }})"
            echo ""
            echo '```'
            tail -n 25 <<< "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Per-file coverage as a table, so the number is visible without opening
      # the step log or downloading the artifact.
      - name: Coverage table to Summary
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import os, xml.etree.ElementTree as ET
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          py = os.environ["PY_VERSION"]
          try:
              root = ET.parse("coverage.xml").getroot()
          except Exception as exc:
              print(f"### ⚠️ Coverage (py{py}): no report ({exc})", file=out)
              raise SystemExit(0)
          total = float(root.get("line-rate", 0)) * 100
          print(f"### Coverage (py{py}): **{total:.0f}%**", file=out)
          print("", file=out)
          print("| File | Statements | Missed | Covered |", file=out)
          print("| --- | ---: | ---: | ---: |", file=out)
          for cls in sorted(root.iter("class"), key=lambda c: c.get("filename")):
              found = cls.find("lines")
              lines = list(found) if found is not None else []
              stmts = len(lines)
              missed = sum(1 for line in lines if line.get("hits") == "0")
              rate = float(cls.get("line-rate", 0)) * 100
              mark = "✅" if rate == 100 else ("⚠️" if rate else "❌")
              print(
                  f"| `{cls.get('filename')}` | {stmts} | {missed} | {mark} {rate:.0f}% |",
                  file=out,
              )
          EOF
        env:
          PY_VERSION: ${{ matrix.python-version }}

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        # act cannot mint an ACTIONS_RUNTIME_TOKEN, so uploads always fail there.
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

      # ci-metrics contract for the CI report: the counts line, the failing
      # tests and the per-file coverage table the PR comment folds.
      - name: Metrics for the CI report
        if: ${{ !cancelled() }}
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          python3 - <<'EOF'
          import json, os, xml.etree.ElementTree as ET

          py = os.environ["PY_VERSION"]
          metrics = {"py": py, "tests_label": f"python tests (py{py})"}
          findings, degraded = {}, []

          try:
              root = ET.parse("junit.xml").getroot()
              # pytest writes <testsuites><testsuite>; older versions the suite alone.
              suite = root.find("testsuite") if root.tag == "testsuites" else root
              total = int(suite.get("tests", 0))
              fails = int(suite.get("failures", 0))
              errs = int(suite.get("errors", 0))
              skips = int(suite.get("skipped", 0))
              took = float(suite.get("time", 0))
              metrics["tests"] = (f"{total - fails - errs - skips}/{total} passed, "
                                  f"{errs} errors, {fails} failures"
                                  + (f", {skips} skipped" if skips else "")
                                  + f" in {took:.1f}s")
              metrics["tests_failed"] = fails + errs
              rows = []
              for case in suite.iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(":")
                      why = " ".join((bad.get("message") or bad.text or "").split())
                      rows.append(f"{name}  {why[:300]}")
              if rows:
                  findings["tests"] = rows[:50]
          except Exception as exc:
              # No junit.xml: pytest died before writing it (a collection error,
              # an install failure). "no tests" would read as a green suite.
              degraded.append(f"pytest (py{py}): no junit report ({exc})")

          try:
              root = ET.parse("coverage.xml").getroot()
              metrics["pycov"] = round(float(root.get("line-rate", 0)) * 100, 1)
              rows = []
              for cls in sorted(root.iter("class"), key=lambda c: c.get("filename")):
                  found = cls.find("lines")
                  lines = list(found) if found is not None else []
                  missed = sum(1 for line in lines if line.get("hits") == "0")
                  rate = float(cls.get("line-rate", 0)) * 100
                  mark = "✅" if rate == 100 else ("⚠️" if rate else "❌")
                  rows.append(f"| `{cls.get('filename')}` | {len(lines)} | {missed} | {mark} {rate:.0f}% |")
              if rows:
                  findings["coverage_files"] = rows
          except Exception as exc:
              degraded.append(f"coverage (py{py}): no report ({exc})")

          if degraded:
              findings["radar_degraded"] = degraded
          metrics["findings"] = findings
          os.makedirs("ci-metrics", exist_ok=True)
          json.dump(metrics, open("ci-metrics/python.json", "w"))
          EOF

      - name: Upload metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: ci-metrics-python-${{ matrix.python-version }}
          path: ci-metrics/
          retention-days: 7

      # relay.py imports telethon/httpx at module level; a broken import must
      # not wait for a container restart at 3am to be discovered. chat_id.py is
      # deliberately excluded: it is a script, and importing it calls Telegram.
      - name: Import smoke test
        run: python -c "import relay, parser; print('imports OK')"

  # ------------------------------------------------------------------ #
  #  actionlint: hard gate over the workflow files themselves           #
  # ------------------------------------------------------------------ #
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: actionlint
        # The action shells out to docker, which act's job containers lack.
        if: ${{ !env.ACT }}
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4   # v0.1.13

      - name: actionlint results to Summary
        if: ${{ always() && !env.ACT }}
        run: |
          f="actionlint-errors.json"
          if [ -s "$f" ] && python3 -c "import json,sys; sys.exit(0 if json.load(open('$f')) else 1)"; then
            {
              echo "## ❌ actionlint findings"
              echo ""
              echo '```'
              python3 -c "import json; [print(f\"{e['file']}:{e['line']}: {e['message']}\") for e in json.load(open('$f'))]"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ actionlint: clean" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ci-metrics contract for the CI report.
      - name: Metrics for the CI report
        if: ${{ always() && !env.ACT }}
        run: |
          python3 - <<'EOF'
          import json, os

          metrics, findings = {}, {}
          try:
              errs = json.load(open("actionlint-errors.json")) or []
              metrics["actionlint"] = len(errs)
              rows = [f"{e.get('file', '?')}:{e.get('line', 0)}  {e.get('message', '')}" for e in errs]
              if rows:
                  findings["actionlint"] = rows[:50]
          except Exception as exc:
              # The action did not run or wrote nothing parseable: no count, one
              # degraded row — a missing number must not read as zero findings.
              findings["radar_degraded"] = [f"actionlint: no result file ({exc})"]
          metrics["findings"] = findings
          os.makedirs("ci-metrics", exist_ok=True)
          json.dump(metrics, open("ci-metrics/actionlint.json", "w"))
          EOF

      - name: Upload metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: ${{ always() && !env.ACT }}
        with:
          name: ci-metrics-actionlint
          path: ci-metrics/
          retention-days: 7

  # ------------------------------------------------------------------ #
  #  Security: Trivy filesystem scan (vulns, secrets, misconfig)        #
  #  BLOCKING: a scan that cannot run reds the build. Only the          #
  #  Security-tab push is soft-fail — it needs GitHub Advanced          #
  #  Security, which this private repo may not have.                    #
  # ------------------------------------------------------------------ #
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read   # codeql-action reads the run it belongs to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy table summary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH

      - name: Scan results to Summary
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          try:
              sarif = json.load(open("trivy-results.sarif"))
              results = [r for run in sarif.get("runs", []) for r in run.get("results", [])]
          except Exception as e:
              print(f"## ⚠️ Trivy: could not parse SARIF ({e})", file=out)
              raise SystemExit(0)
          if not results:
              print("## ✅ Trivy: no findings", file=out)
          else:
              print(f"## ⚠️ Trivy: {len(results)} finding(s)", file=out)
              print("", file=out)
              print("| Rule | Level | Location |", file=out)
              print("| --- | --- | --- |", file=out)
              for r in results[:50]:
                  loc = ""
                  try:
                      loc = r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
                  except Exception:
                      pass
                  print(f"| {r.get('ruleId','?')} | {r.get('level','?')} | {loc} |", file=out)
              if len(results) > 50:
                  print(f"\n_…{len(results)-50} more in the trivy-report artifact._", file=out)
          EOF

      # ci-metrics contract for the CI report: the same SARIF, as rows the PR
      # comment can link into the tree.
      - name: Metrics for the CI report
        if: ${{ always() }}
        run: |
          python3 - <<'EOF'
          import json, os

          metrics, findings = {}, {}
          try:
              sarif = json.load(open("trivy-results.sarif"))
              results = [r for run in sarif.get("runs", []) for r in run.get("results", [])]
              metrics["trivy"] = len(results)
              rows = []
              for r in results:
                  loc, line = "", 0
                  try:
                      phys = r["locations"][0]["physicalLocation"]
                      loc = phys["artifactLocation"]["uri"]
                      line = (phys.get("region") or {}).get("startLine", 0)
                  except Exception:
                      pass
                  where = f"{loc}:{line}" if loc and line else (loc or "—")
                  msg = " ".join(((r.get("message") or {}).get("text") or "").split())
                  rows.append(f"{where}  [{r.get('ruleId', '?')}] {msg[:280]}")
              if rows:
                  findings["trivy"] = rows[:50]
          except Exception as exc:
              # A scan that could not be parsed is not a clean scan.
              findings["radar_degraded"] = [f"trivy: could not parse the SARIF ({exc})"]
          metrics["findings"] = findings
          os.makedirs("ci-metrics", exist_ok=True)
          json.dump(metrics, open("ci-metrics/security.json", "w"))
          EOF

      - name: Upload metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: ${{ always() && !env.ACT }}
        with:
          name: ci-metrics-security
          path: ci-metrics/
          retention-days: 7

      - name: Upload Trivy report (artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: ${{ always() && !env.ACT }}
        with:
          name: trivy-report
          path: trivy-results.sarif
          retention-days: 90

      # The Security tab needs code scanning, which on a private repo means
      # GitHub Advanced Security. Without it the upload cannot succeed and
      # prints an error annotation on every single run, so it is opt-in:
      #   gh variable set ENABLE_CODE_SCANNING --body true
      # The trivy-report artifact above carries the same SARIF either way.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4
        if: ${{ always() && !env.ACT && vars.ENABLE_CODE_SCANNING == 'true' }}
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  # ------------------------------------------------------------------ #
  #  Image: the artifact that actually runs on the host                 #
  # ------------------------------------------------------------------ #
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4
        if: ${{ !env.ACT }}

      - name: Build image
        id: build
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7
        with:
          context: .
          push: false
          load: true
          tags: lexx-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No .env in CI, so the relay must fail on missing config, not on a
      # broken image. --help exercises the entrypoint without credentials.
      - name: Smoke test the image
        id: smoke
        if: ${{ !env.ACT }}
        run: |
          docker run --rm lexx-relay:ci python relay.py --help
          echo "## ✅ Image builds and starts" >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy image scan
        if: ${{ !env.ACT }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: image
          image-ref: lexx-relay:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"   # base-image CVEs are informational, not a merge blocker

      # ci-metrics contract for the CI report: the image is the artifact that
      # actually runs on the host, so its verdict gets a line of its own.
      - name: Metrics for the CI report
        if: ${{ always() && !env.ACT }}
        env:
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          python3 - <<'EOF'
          import json, os

          build, smoke = os.environ.get("BUILD", ""), os.environ.get("SMOKE", "")
          green = build == "success" and smoke == "success"
          note = "builds and starts" if green else f"build {build or 'skipped'} · smoke {smoke or 'skipped'}"
          metrics = {"docker": "green" if green else "red", "docker_note": note, "findings": {}}
          os.makedirs("ci-metrics", exist_ok=True)
          json.dump(metrics, open("ci-metrics/docker.json", "w"))
          EOF

      - name: Upload metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: ${{ always() && !env.ACT }}
        with:
          name: ci-metrics-docker
          path: ci-metrics/
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read   # the action enumerates the commits of its PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        id: gitleaks
        if: ${{ !env.ACT }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e   # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ci-metrics contract for the CI report. The action's report file is the
      # only place the leaks are named; without it a red step can still say how
      # many, but never which — that is a degraded radar, not a clean one.
      - name: Metrics for the CI report
        if: ${{ always() && !env.ACT }}
        env:
          OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          python3 - <<'EOF'
          import glob, json, os

          metrics, findings = {}, {}
          report = next(iter(glob.glob("results.sarif") + glob.glob("gitleaks-report.json")), "")
          rows = []
          try:
              if not report:
                  raise FileNotFoundError("no gitleaks report in the workspace")
              data = json.load(open(report))
              if report.endswith(".sarif"):
                  results = [r for run in data.get("runs", []) for r in run.get("results", [])]
                  for r in results:
                      loc, line = "", 0
                      try:
                          phys = r["locations"][0]["physicalLocation"]
                          loc = phys["artifactLocation"]["uri"]
                          line = (phys.get("region") or {}).get("startLine", 0)
                      except Exception:
                          pass
                      msg = " ".join(((r.get("message") or {}).get("text") or "").split())
                      rows.append(f"{loc}:{line}  [{r.get('ruleId', '?')}] {msg[:280]}")
              else:
                  for r in data:
                      rows.append(f"{r.get('File', '?')}:{r.get('StartLine', 0)}  "
                                  f"[{r.get('RuleID', '?')}] {r.get('Description', '')[:280]}")
              metrics["secrets"] = len(rows)
              if rows:
                  findings["secrets"] = rows[:50]
          except Exception as exc:
              outcome = os.environ.get("OUTCOME", "")
              why = "the scan failed" if outcome == "failure" else str(exc)
              findings["radar_degraded"] = [f"gitleaks: no machine-readable report ({why})"]
          metrics["findings"] = findings
          os.makedirs("ci-metrics", exist_ok=True)
          json.dump(metrics, open("ci-metrics/secrets.json", "w"))
          EOF

      - name: Upload metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: ${{ always() && !env.ACT }}
        with:
          name: ci-metrics-secrets
          path: ci-metrics/
          retention-days: 7

  supply-chain:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install toolchain
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements-ci.lock

      # Blocking: a workflow that leaks its token or runs attacker-controlled
      # input is a supply-chain hole, not a style nit.
      - name: zizmor (workflow audit)
        run: |
          set +e
          out=$(zizmor --persona=regular --format plain .github/workflows 2>&1)
          rc=$?
          set -e
          echo "$out"
          printf '%s\n' "$out" > zizmor.log
          {
            echo "## $([ $rc -eq 0 ] && echo '✅' || echo '❌') zizmor"
            echo ""
            echo '```'
            tail -n 60 <<< "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Informational: a CVE in a linter cannot reach production from here,
      # and a fresh advisory should not red an unrelated PR.
      - name: pip-audit (CI toolchain)
        if: ${{ !cancelled() }}
        run: |
          set +e
          out=$(pip-audit --strict --progress-spinner off 2>&1)
          rc=$?
          set -e
          echo "$out"
          printf '%s\n' "$out" > pip-audit.log
          if [ "$rc" -ne 0 ]; then
            echo "::warning::pip-audit findings in the CI toolchain (non-blocking)"
            {
              echo "## ⚠️ pip-audit (informational)"
              echo ""
              echo '```'
              tail -n 40 <<< "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ pip-audit: no known CVEs" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ci-metrics contract for the CI report.
      - name: Metrics for the CI report
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import json, os, re

          metrics, findings, degraded = {}, {}, []

          # zizmor --format plain: "error[rule]: message" followed by
          # "  --> path:line:col". The location line is what makes the row
          # clickable in the PR comment.
          RULE = re.compile(r"^(?:error|warning)\[(?P<rule>[^\]]+)\]:\s*(?P<msg>.*)$")
          ARROW = re.compile(r"^\s*-->\s*(?P<loc>\S+)")
          try:
              lines = open("zizmor.log", encoding="utf-8", errors="replace").read().split("\n")
              rows, pending = [], None
              for line in lines:
                  m = RULE.match(line)
                  if m:
                      if pending:
                          rows.append(f"—  [{pending['rule']}] {pending['msg'][:280]}")
                      pending = {"rule": m["rule"], "msg": m["msg"]}
                      continue
                  a = ARROW.match(line)
                  if a and pending:
                      rows.append(f"{a['loc']}  [{pending['rule']}] {pending['msg'][:280]}")
                      pending = None
              if pending:
                  rows.append(f"—  [{pending['rule']}] {pending['msg'][:280]}")
              metrics["zizmor"] = len(rows)
              if rows:
                  findings["zizmor"] = rows[:50]
          except OSError as exc:
              degraded.append(f"zizmor: no output captured ({exc})")

          # pip-audit's table: a header, a dashed rule, then one row per
          # advisory. Anything before the rule is chatter.
          try:
              lines = open("pip-audit.log", encoding="utf-8", errors="replace").read().split("\n")
              rows, started = [], False
              for line in lines:
                  if set(line.strip()) == {"-"} and line.strip():
                      started = True
                      continue
                  if not started or not line.strip():
                      continue
                  cols = line.split()
                  if len(cols) < 3:
                      continue
                  name, version, vuln = cols[0], cols[1], cols[2]
                  fix = " ".join(cols[3:]) or "no fix listed"
                  rows.append(f"—  {name} {version}: {vuln} (fix: {fix})")
              metrics["pip_audit"] = len(rows)
              if rows:
                  findings["pip_audit"] = rows[:50]
          except OSError as exc:
              degraded.append(f"pip-audit: no output captured ({exc})")

          if degraded:
              findings["radar_degraded"] = degraded
          metrics["findings"] = findings
          os.makedirs("ci-metrics", exist_ok=True)
          json.dump(metrics, open("ci-metrics/supply-chain.json", "w"))
          EOF

      - name: Upload metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: ci-metrics-supply-chain
          path: ci-metrics/
          retention-days: 7

  # ------------------------------------------------------------------ #
  #  Radar: the slow / noisy checks. INFORMATIONAL by design — none of   #
  #  these reds a PR. Their counts ride in the sticky CI report, where   #
  #  a backlog is visible without being a merge blocker.                 #
  # ------------------------------------------------------------------ #
  python-radar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install radar toolchain
        run: |
          # The project's own dependencies go in too, not just the tools.
          # Without them pyright resolves no third-party import and deptry
          # cannot map a distribution to the module it provides (Pillow ->
          # PIL), so both spend their findings restating that the venv is
          # empty. pyaes (a telethon dep) publishes no wheel; its sdist stays
          # hash-pinned, same as the other lanes.
          pip install --require-hashes --only-binary :all: --no-binary pyaes -r requirements.lock
          pip install --require-hashes --only-binary :all: -r .github/requirements-ci.lock
          pip install --require-hashes --only-binary :all: -r .github/requirements-radar.lock

      # One step, four tools: a crash in any of them costs its own cell, not
      # the whole radar. Everything lands in ci-metrics/radar.json.
      - name: Python radar (informational)
        if: ${{ !env.ACT }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, subprocess

          # The modules that ship, in the order the tools want them. The suite
          # is excluded from pyright and vulture on purpose (see each below);
          # deptry and semgrep still read the whole tree.
          SRC = sorted(f for f in glob.glob("*.py")
                       if not f.startswith("test_") and f != "conftest.py")

          metrics, findings, degraded = {}, {}, []

          def run(cmd, timeout=600):
              return subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)

          def trim(s, n=280):
              return " ".join(str(s).split())[:n]

          # ---- pyright: the shipped modules, not the tests ----
          # The suite drives the code with duck-typed doubles — FakeHTTP where
          # an httpx.AsyncClient is declared — which pyright is structurally
          # right to reject and which nobody intends to fix: that is what the
          # doubles are for. Judged over the tree it reported 242 of those and
          # 15 findings about the code that ships, which is a radar reporting
          # its own configuration. Scoped to the modules instead.
          try:
              r = run(["pyright", "--outputjson", *SRC])
              data = json.loads(r.stdout or "{}")
              rows = []
              for d in data.get("generalDiagnostics", []):
                  if d.get("severity") not in ("error", "warning"):
                      continue
                  path = os.path.relpath(d.get("file", ""), os.getcwd())
                  line = (d.get("range") or {}).get("start", {}).get("line", 0) + 1
                  rule = d.get("rule") or d.get("severity", "?")
                  rows.append(f"{path}:{line}  [{rule}] {trim(d.get('message'))}")
              metrics["pyright"] = len(rows)
              if rows:
                  findings["pyright"] = rows[:50]
          except Exception as exc:
              degraded.append(f"pyright: did not run ({trim(exc, 160)})")

          # ---- vulture: dead code, again the modules only ----
          # A pytest fixture is requested by naming it in the signature and is
          # then never referenced in the body, so vulture calls every fixture
          # parameter an unused variable: 297 findings over the tree, 0 over
          # the modules. All 297 said "this is a pytest suite".
          try:
              r = run(["vulture", *SRC, "--min-confidence", "80"])
              rows = [trim(x) for x in r.stdout.split("\n") if x.strip()]
              metrics["vulture"] = len(rows)
              if rows:
                  findings["vulture"] = rows[:50]
          except Exception as exc:
              degraded.append(f"vulture: did not run ({trim(exc, 160)})")

          # ---- deptry: imports vs declared dependencies ----
          try:
              # The dev manifests have to be named or every `import pytest`
              # reads as an undeclared dependency; DEP004 then says the suite
              # imports a dev dependency, which is what a suite is for. The
              # tests stay in scope so a genuinely undeclared import in them
              # still surfaces.
              run(["deptry", ".",
                   "--requirements-files", "requirements.txt",
                   "--requirements-files-dev",
                   ".github/requirements-ci.txt,.github/requirements-radar.txt",
                   "--per-rule-ignores", "DEP004=pytest",
                   "--json-output", "deptry.json"])
              data = json.load(open("deptry.json"))
              rows = [f"{d.get('location', {}).get('file', '?')}:"
                      f"{d.get('location', {}).get('line', 0)}  "
                      f"[{d.get('error', {}).get('code', '?')}] {trim(d.get('error', {}).get('message'))}"
                      for d in data]
              metrics["deptry"] = len(rows)
              metrics["deptry_spec"] = "pyproject.toml / requirements.txt"
              if rows:
                  findings["deptry"] = rows[:50]
          except Exception as exc:
              degraded.append(f"deptry: did not run ({trim(exc, 160)})")

          # ---- semgrep: bug and security patterns beyond bandit ----
          try:
              r = run(["semgrep", "--config", "p/python", "--json", "--quiet",
                       "--metrics", "off", "."], timeout=900)
              data = json.loads(r.stdout or "{}")
              rows = [f"{x.get('path', '?')}:{x.get('start', {}).get('line', 0)}  "
                      f"[{x.get('check_id', '?').split('.')[-1]}] "
                      f"{trim((x.get('extra') or {}).get('message'))}"
                      for x in data.get("results", [])]
              metrics["semgrep"] = len(rows)
              if data.get("errors"):
                  metrics["semgrep_error"] = True
              if rows:
                  findings["semgrep"] = rows[:50]
          except Exception as exc:
              degraded.append(f"semgrep: did not run ({trim(exc, 160)})")

          if degraded:
              findings["radar_degraded"] = degraded
          metrics["findings"] = findings
          os.makedirs("ci-metrics", exist_ok=True)
          json.dump(metrics, open("ci-metrics/radar.json", "w"))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              print("## 🛰️ Python radar (informational)", file=f)
              print("", file=f)
              print("| check | findings |", file=f)
              print("| --- | ---: |", file=f)
              for k in ("pyright", "vulture", "deptry", "semgrep"):
                  if k in metrics:
                      print(f"| {k} | {metrics[k]} |", file=f)
                  else:
                      print(f"| {k} | ⚠️ did not run |", file=f)
          EOF

      - name: Upload metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: ci-metrics-radar
          path: ci-metrics/
          retention-days: 7

  # ------------------------------------------------------------------ #
  #  Links: the README is the front door and carries dozens of them.     #
  #  Informational — a third-party site being down is not this repo's    #
  #  problem, but a link that has been dead for a month is.              #
  # ------------------------------------------------------------------ #
  link-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: lychee (markdown links, informational)
        if: ${{ !env.ACT }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8   # v2.9.0
        with:
          # `format` and `output` are action inputs, NOT args: the entrypoint
          # refuses a run that sets either in both places
          # ("'output' is set in args as well as in the action configuration").
          args: >-
            --no-progress --include-verbatim --max-retries 2
            --exclude-path .github/workflows
            "**/*.md"
          format: json
          output: lychee.json
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Metrics for the CI report
        if: ${{ !cancelled() && !env.ACT }}
        run: |
          python3 - <<'EOF'
          import json, os

          metrics, findings = {}, {}
          try:
              data = json.load(open("lychee.json"))
              total = (data.get("total") or 0)
              rows = []
              for src, fails in (data.get("fail_map") or {}).items():
                  for f in fails:
                      url = f.get("url") if isinstance(f, dict) else str(f)
                      why = (f.get("status") or {}).get("text", "") if isinstance(f, dict) else ""
                      rows.append(f"{src}  {url} — {' '.join(str(why).split())[:160]}")
              metrics["links_total"] = total
              metrics["links_broken"] = len(rows)
              if rows:
                  findings["links"] = rows[:50]
          except Exception as exc:
              # No report: lychee crashed or was rate-limited. "0 broken" would
              # be a lie.
              findings["radar_degraded"] = [f"lychee: no report ({exc})"]
          metrics["findings"] = findings
          os.makedirs("ci-metrics", exist_ok=True)
          json.dump(metrics, open("ci-metrics/links.json", "w"))
          EOF

      - name: Upload metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: ci-metrics-links
          path: ci-metrics/
          retention-days: 7

  sonar:
    # Opt-in: SonarQube Cloud refuses a CI analysis while Automatic Analysis is
    # enabled on the project, so switch that off first, then
    #   gh variable set ENABLE_SONAR_CI --body true
    if: ${{ vars.ENABLE_SONAR_CI == 'true' }}
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0   # Sonar attributes findings to commits; shallow blinds it
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          python-version: "3.13"
          cache: pip

      # Sonar reads coverage.xml rather than running the suite itself.
      - name: Coverage report for Sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          # pyaes (telethon dep) publishes no wheel; its sdist stays hash-pinned.
          pip install --require-hashes --only-binary :all: --no-binary pyaes -r requirements.lock
          pip install --require-hashes --only-binary :all: -r .github/requirements-ci.lock
          pytest --cov --cov-report=xml --color=no

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && !env.ACT }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9   # v8.3.0

      # The scanner returns as soon as the upload lands; the verdict is computed
      # server-side afterwards. Without this step the job goes green while the
      # Quality Gate is still pending, and the findings stay on sonarcloud.io
      # where nothing in the run points at them.
      - name: Quality Gate and findings to Summary
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' && !env.ACT }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          token = os.environ["SONAR_TOKEN"]
          summary_file = open(os.environ["GITHUB_STEP_SUMMARY"], "a")


          def say(line=""):
              """Write to the run summary and to the step log.

              The summary renders on its own tab, so a step that only writes
              there looks silent from the log -- which is exactly how the
              earlier breakage stayed invisible.
              """
              print(line, file=summary_file)
              print(line)


          def api(url):
              req = urllib.request.Request(url)
              req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace").strip()
                  raise RuntimeError(f"{url.split('?')[0]} -> HTTP {exc.code} {detail}") from None


          def report_gate():
              """Write the verdict and the open issues; return True if the gate failed."""
              report = dict(
                  line.split("=", 1)
                  for line in open(".scannerwork/report-task.txt").read().splitlines()
                  if "=" in line
              )
              server, key, dashboard = (
                  report["serverUrl"],
                  report["projectKey"],
                  report["dashboardUrl"],
              )

              # The compute engine queues the analysis; poll it out rather than
              # guessing how long it takes.
              task = {}
              for _ in range(60):
                  task = api(report["ceTaskUrl"])["task"]
                  if task["status"] in ("SUCCESS", "FAILED", "CANCELED"):
                      break
                  time.sleep(5)

              if task.get("status") != "SUCCESS":
                  say(f"## ⚠️ Sonar: analysis {task.get('status', 'timed out')}")
                  say(f"\n[Dashboard]({dashboard})")
                  return False

              # A pull request analysis is not addressable by analysisId -- that
              # answers HTTP 400. Both endpoints take the same scope parameter,
              # so build it once from whatever the task says it analysed.
              if task.get("pullRequest"):
                  scope = "&" + urllib.parse.urlencode({"pullRequest": task["pullRequest"]})
              elif task.get("branch"):
                  scope = "&" + urllib.parse.urlencode({"branch": task["branch"]})
              else:
                  scope = ""

              gate = api(
                  f"{server}/api/qualitygates/project_status"
                  f"?{urllib.parse.urlencode({'projectKey': key})}{scope}"
              )["projectStatus"]
              mark = {"OK": "✅", "ERROR": "❌"}.get(gate["status"], "⚠️")
              say(f"## {mark} Sonar Quality Gate: {gate['status']}")
              say()

              failed = [c for c in gate.get("conditions", []) if c["status"] != "OK"]
              if failed:
                  say("| Condition | Actual | Threshold |")
                  say("| --- | ---: | ---: |")
                  for c in failed:
                      say(
                          f"| {c['metricKey']} | {c.get('actualValue', '?')} "
                          f"| {c['comparator']} {c.get('errorThreshold', '?')} |"
                      )
                  say()

              # SonarQube Cloud names this parameter componentKeys; "components"
              # is Server-only and answers HTTP 400 here.
              query = urllib.parse.urlencode(
                  {
                      "componentKeys": key,
                      "resolved": "false",
                      "ps": 50,
                      "s": "SEVERITY",
                      "asc": "false",
                  }
              )
              issues = api(f"{server}/api/issues/search?{query}{scope}")
              found = issues.get("issues", [])
              if not found:
                  say("No open issues.")
              else:
                  say(f"### {issues.get('total', len(found))} open issue(s)")
                  say()
                  say("| Rule | Impact | Location | Message |")
                  say("| --- | --- | --- | --- |")
                  for issue in found:
                      where = issue.get("component", "").split(":", 1)[-1]
                      line = issue.get("line")
                      impact = (
                          ", ".join(
                              f"{i['softwareQuality'].lower()}:{i['severity'].lower()}"
                              for i in issue.get("impacts", [])
                          )
                          or issue.get("severity", "?")
                      )
                      # A pipe in the message would split the table row.
                      message = issue.get("message", "").replace("|", "\\|")
                      say(
                          f"| `{issue.get('rule', '?')}` | {impact} "
                          f"| {where}{f':{line}' if line else ''} | {message} |"
                      )

              say(f"\n[Full report]({dashboard})")
              return gate["status"] == "ERROR"


          # A hiccup in the reporting itself is not a reason to red the build:
          # only the gate verdict is. The scan step already failed if the
          # analysis never reached Sonar.
          try:
              failed_gate = report_gate()
          except (OSError, RuntimeError, KeyError) as exc:
              say(f"## ⚠️ Sonar: could not read the verdict ({exc})")
              failed_gate = False

          raise SystemExit(1 if failed_gate else 0)
          EOF

      - name: Note a missing token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "## ⏭️ Sonar: skipped (no SONAR_TOKEN secret)" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ #
  #  Report: the run's ONE post on the pull request                      #
  # ------------------------------------------------------------------ #
  #
  # Aggregates the per-job ci-metrics-* artifacts of this run into the run
  # Summary and one sticky comment on the PR, folding its earlier selves as
  # OUTDATED so the current report always sits at the bottom of the thread.
  # Ported from Navflex/.github's ci-report.yml, which is a reusable workflow
  # the caller invokes with `needs:` on every producing lane — the same shape
  # as this job.
  #
  # Last, with `needs:` on every lane, so the artifacts it reads are all
  # uploaded by the time it runs; `if: always()` because a red run is exactly
  # the one worth reporting.
  #
  # Known limit: a pull request from a FORK cannot be commented on from here.
  # "The GITHUB_TOKEN has read-only permissions in pull requests from forked
  # repositories", and no permissions block raises it — the report still
  # lands in the run Summary, it just does not reach the conversation. The
  # alternative is a separate workflow_run workflow, which does reach forks
  # but is a trigger zizmor rates high and that this repo, with no outside
  # contributors, has no reason to carry.
  #
  # The ci-metrics-* contract every lane above follows, so that a finding
  # reaches the comment rather than only the log:
  #   * counts top-level (`"zizmor": 3`), the first 50 rows under
  #     findings.<tool> as "<path>[:<line>]  <message>" — one folded table
  #     per tool, locations linked into the head commit;
  #   * a tool that did not run, crashed without findings or scanned only
  #     part of the tree ships NO count and one row under
  #     findings.radar_degraded ("<tool>: <why>"), so "skipped" never reads
  #     as "clean".
  #
  # Layout: the Gates fold and the finding lists of whatever failed sit above
  # the divider; tests, coverage and its delta against the default branch
  # below it; the informational radars after that, clean cells folded behind
  # one line; the commit-style badge closes it.
  # ------------------------------------------------------------------ #
  report:
    needs: [quality, tests, actionlint, security, docker, secrets, supply-chain,
            python-radar, link-check, sonar]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read          # list the CI run's jobs and download its artifacts
      pull-requests: write   # the sticky comment
    steps:
      - name: Compose and post the report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha || github.sha }}/
          REPORT_EXPAND: failed
          REPORT_PY: |
            import glob, html, json, os, re, urllib.parse, urllib.request

            CIM = os.environ["CIM"]

            def load(pattern):
                for p in sorted(glob.glob(pattern)):
                    try:
                        return json.load(open(p))
                    except Exception:
                        pass
                return {}

            def load_all(pattern):
                out = []
                for p in sorted(glob.glob(pattern)):
                    try:
                        out.append(json.load(open(p)))
                    except Exception:
                        pass
                return out

            # hooks.json by name, not *.json: commitstyle.json sits beside it
            # in the same artifact.
            hks = load(f"{CIM}/ci-metrics-hooks/hooks.json")
            al  = load(f"{CIM}/ci-metrics-actionlint/*.json")   # actionlint findings
            sec = load(f"{CIM}/ci-metrics-security/*.json")     # trivy fs scan
            zz  = load(f"{CIM}/ci-metrics-supply-chain/*.json") # zizmor + pip-audit
            dk  = load(f"{CIM}/ci-metrics-docker/*.json")       # image build + smoke
            gl  = load(f"{CIM}/ci-metrics-secrets/*.json")      # gitleaks
            rad = load(f"{CIM}/ci-metrics-radar/*.json")        # pyright, vulture, deptry, semgrep
            lnk = load(f"{CIM}/ci-metrics-links/*.json")        # lychee
            # The quality lane judges the commit range with the hook itself;
            # the collect step's own pass is the fallback for a run where the
            # lane shipped nothing (a push, or a job that died early).
            cstyle = load(f"{CIM}/ci-metrics-hooks/commitstyle.json") or load(f"{CIM}/commitstyle.json")
            # One tests artifact per interpreter; the newest is the one the
            # image runs, so it owns the coverage line and the delta.
            pys = load_all(f"{CIM}/ci-metrics-python-*/*.json")
            pys.sort(key=lambda d: [int(x) for x in str(d.get("py", "0")).split(".")])
            py = pys[-1] if pys else {}
            base = load(f"{CIM}/base/*.json")

            # Informational gates report success to the jobs API: each job ships
            # its failed step ids, keyed by display name -> a warning cell.
            outcomes = {}
            for p in glob.glob(f"{CIM}/ci-metrics-outcomes-*/*.json"):
                try:
                    o = json.load(open(p))
                except Exception:
                    continue
                if o.get("failed_steps"):
                    outcomes.setdefault(o.get("name") or o.get("job", "?"), []).extend(o["failed_steps"])

            marker = "<!-- ci-report -->"
            L = [marker, "## 🧪 CI report", ""]
            EXPAND = (os.environ.get("REPORT_EXPAND") or "none").strip().lower()
            OPEN_TOP = " open" if EXPAND in ("all", "failed") else ""
            OPEN_ALL = " open" if EXPAND == "all" else ""
            RUN = os.environ.get("RUN_URL", "")
            SUMMARY = f"[run Summary]({RUN})" if RUN else "run Summary"

            try:
                missing = [m for m in open(f"{CIM}/missing.txt").read().split("\n") if m]
            except Exception:
                missing = []
            if missing:
                L.append("⚠️ **Report incomplete** — could not fetch: "
                         + ", ".join(f"`{m}`" for m in missing)
                         + f" (transient API failure, 3 attempts). The gates' own verdicts are in the {SUMMARY}.")
                L.append("")

            try:
                jobs = json.load(open(f"{CIM}/jobs.json"))
            except Exception:
                jobs = []
            # This job is in that list and is still running while it reads it:
            # left in, it would render as a pending gate and drag the verdict
            # to "still running" on every green run.
            jobs = [j for j in jobs if "report" not in j.get("name", "")]
            failed = [j for j in jobs if j.get("conclusion") == "failure"]

            # ---- Gates: one cell per job that can fail the run.
            rank = {"❌": 4, "⚠️": 3, "⏳": 2, "✅": 1, "⏭️": 0}
            gates, gsteps = {}, {}
            for j in jobs:
                c = j.get("conclusion")
                lab = j["name"].split(" / ")[-1]
                warn = outcomes.get(lab) or []
                icon = "✅" if c == "success" else ("❌" if c == "failure" else ("⏭️" if c in ("skipped", "neutral") else "⏳"))
                if warn and icon == "✅":
                    icon = "⚠️"
                # A skipped job asserts nothing; a dependency-skip is covered by
                # the dependency's own ❌.
                if icon == "⏭️":
                    continue
                if lab not in gates or rank[icon] > rank[gates[lab]]:
                    gates[lab] = icon
                if c == "failure":
                    gsteps.setdefault(lab, []).extend(j.get("steps") or [])
                if warn:
                    gsteps.setdefault(lab, []).extend(warn)

            # ---- What blocks, above the divider: a finding list whose tool failed
            # a step belongs with the Gates, not with the tech debt.
            GATE_HINTS = {
                "hooks_gate": ("lint changed code",),
                "hooks": ("full-tree hooks",),
                "python_tests": ("pytest",),
                "actionlint": ("actionlint",),
                "trivy": ("trivy", "scan results"),
                "zizmor": ("zizmor",),
                "pip-audit": ("pip-audit",),
                "secrets": ("gitleaks",),
                "docker": ("build image", "smoke test"),
                "links": ("lychee",),
            }
            red_txt = " ".join(str(s).lower() for k, v in gates.items() if v == "❌" for s in gsteps.get(k, []))
            warn_txt = " ".join(str(s).lower() for k, v in gates.items() if v == "⚠️" for s in gsteps.get(k, []))
            claimed = {t: "❌" for t, hs in GATE_HINTS.items() if any(h in red_txt for h in hs)}
            claimed.update({t: "⚠️" for t, hs in GATE_HINTS.items()
                            if t not in claimed and any(h in warn_txt for h in hs)})

            # Job leaf -> what a green cell asserts: what was checked, the tool in
            # parentheses. Unknown names render raw.
            GATE_LABEL = {
                "quality": "pre-commit hooks, changed files and full tree",
                "actionlint": "workflow syntax / shellcheck (actionlint)",
                "security": "vulnerable deps, secrets, misconfig (trivy fs)",
                "docker": "image builds and starts (docker + trivy image)",
                "secrets": "credentials in the history (gitleaks)",
                "supply-chain": "workflow audit and CI toolchain CVEs (zizmor, pip-audit)",
                "sonar": "SonarQube quality gate",
                "python-radar": "pyright, vulture, deptry, semgrep (informational)",
                "link-check": "md links (lychee, informational)",
            }
            def glabel(lab):
                # the test matrix names itself: "tests (3.14)"
                m = re.fullmatch(r"tests \((\d+\.\d+)\)", lab)
                if m:
                    return f"python tests (pytest + coverage, py{m[1]})"
                return GATE_LABEL.get(lab, lab)

            def gcell(lab):
                st = ", ".join(dict.fromkeys(gsteps.get(lab, []))) if gates[lab] in ("❌", "⚠️") else ""
                return f"{glabel(lab)} {gates[lab]}" + (f" ({st})" if st else "")

            # Sorted by label: the API lists jobs in scheduling order, which
            # changes run to run.
            if gates:
                order = sorted(gates, key=lambda k: glabel(k).lower())
                n = len(order)
                reds = [k for k in order if gates[k] == "❌"]
                gwarn = [k for k in order if gates[k] == "⚠️"]
                pend = [k for k in order if gates[k] == "⏳"]
                names = lambda ks: html.escape(", ".join(glabel(k) for k in ks), quote=False)
                if reds:
                    verdict = f"❌ {len(reds)}/{n} failed: {names(reds)}"
                elif gwarn:
                    verdict = f"⚠️ {n - len(gwarn)}/{n} green · {len(gwarn)} with warnings: {names(gwarn)}"
                elif pend:
                    verdict = f"⏳ {n - len(pend)}/{n} green · {len(pend)} still running"
                else:
                    verdict = f"✅ {n}/{n} green"
                L += [f"<details{OPEN_TOP if (reds or gwarn) else OPEN_ALL}>",
                      f"<summary><b>Gates:</b> {verdict}</summary>", ""]
                L += [f"- {gcell(k)}" for k in order]
                # The trailing blank closes the HTML block: without it the lines
                # below sit inside it and render their markdown literally.
                L += ["", "</details>", ""]
            if any(v == "⚠️" for v in gates.values()):
                L.append("_⚠️ = step(s) failed under an informational gate (job green by design)._")
            if failed and not any((hks, py, al, sec, zz, dk, gl)):
                L.append(f"_Gates failed before metrics were collected — details in the {SUMMARY}._")

            top_at = len(L)
            L += ["", "---", ""]
            mid = len(L)   # the metrics section starts here; dropped when nothing lands in it

            # ---- Tests, one line per interpreter: the matrix is the point.
            for d in pys:
                t = d.get("tests")
                if not t:
                    continue
                bad = bool((d.get("findings") or {}).get("tests")) or bool(d.get("tests_failed"))
                L.append(f"**Tests (py{d.get('py', '?')}):** {'⚠️ ' if bad else ''}{t}")
            # Coverage of the interpreter the image runs, with the delta against
            # the last green run of the default branch.
            if "pycov" in py:
                s = f"**Coverage (py{py.get('py', '?')}):** {py['pycov']}%"
                if "pycov" in base:
                    d = round(py["pycov"] - base["pycov"], 1)
                    arrow = "▲" if d > 0 else ("▼" if d < 0 else "＝")
                    s += f" ({base['pycov']}% → {py['pycov']}%, {arrow}{abs(d)})" if d else " (＝)"
                elif base:
                    s += " (no baseline on the default branch yet)"
                L.append(s)
                # Per-file, folded: the number without the files is not actionable.
                rows = (py.get("findings") or {}).get("coverage_files") or []
                if rows:
                    L += ["", f"<details{OPEN_ALL}>",
                          f"<summary>Coverage per file: {len(rows)} file(s)</summary>", "",
                          "| file | statements | missed | covered |", "| --- | ---: | ---: | ---: |"]
                    L += [str(r) for r in rows]
                    L += ["", "</details>", ""]
            if dk.get("docker"):
                L.append(f"**Image:** {'✅' if dk['docker'] == 'green' else '❌'} {dk.get('docker_note', dk['docker'])}")

            # ---- Radars: one cell per informational tool; >0 is ⚠️ with a folded
            # list. One label per check, shared by the radar cell and its fold
            # title, so the count and the list read the same.
            LABEL = {
                "hooks_gate": "pre-commit hooks on the changed files (the blocking gate)",
                "hooks": "pre-commit hooks (full tree)",
                "python_tests": "failing tests",
                "actionlint": "workflow syntax / shellcheck (actionlint)",
                "trivy": "vulnerable dependencies, secrets, misconfig (trivy)",
                "zizmor": "workflow security audit (zizmor)",
                "pip-audit": "known CVEs in the CI toolchain (pip-audit)",
                "secrets": "credentials in the history (gitleaks)",
                "docker": "image build / smoke findings",
                "pyright": "python types (pyright)",
                "vulture": "python dead code (vulture)",
                "deptry": "python dependency drift (deptry)",
                "semgrep": "security / bug patterns (semgrep)",
                "links": "broken links in md files (lychee)",
            }
            def rd(title, n):
                name = LABEL.get(title, title)
                return f"{name} ✅" if not n else f"{name} {n} ⚠️"
            radar = []
            def radar_add(title, cell_):
                # a tool whose step failed a gate is reported above the line
                if title not in claimed:
                    radar.append((title, cell_))
            if "hooks" in hks: radar_add("hooks", rd("hooks", hks["hooks"]))
            if "hooks_gate" in hks: radar_add("hooks_gate", rd("hooks_gate", hks["hooks_gate"]))
            if "actionlint" in al: radar_add("actionlint", rd("actionlint", al["actionlint"]))
            if "trivy" in sec: radar_add("trivy", rd("trivy", sec["trivy"]))
            if "zizmor" in zz: radar_add("zizmor", rd("zizmor", zz["zizmor"]))
            if "pip_audit" in zz: radar_add("pip-audit", rd("pip-audit", zz["pip_audit"]))
            if "secrets" in gl: radar_add("secrets", rd("secrets", gl["secrets"]))
            # The informational radar lane: none of these reds a PR.
            for key in ("pyright", "vulture", "deptry", "semgrep"):
                if key in rad:
                    cell_ = rd(key, rad[key])
                    if key == "semgrep" and rad.get("semgrep_error"):
                        cell_ += " (engine errors)"
                    radar_add(key, cell_)
            # deptry names what it judged against, so the cell does too.
            if rad.get("deptry_spec"):
                LABEL["deptry"] = f"python dependency drift vs {rad['deptry_spec']} (deptry)"
            if "links_total" in lnk:
                radar_add("links", rd("links", lnk.get("links_broken", 0)))

            # A partial scan is not a clean one.
            degraded = []
            for src in (hks, al, sec, zz, dk, gl, py, rad, lnk):
                for x in (src.get("findings") or {}).get("radar_degraded") or []:
                    if x not in degraded:
                        degraded.append(x)

            warns, degraded_lines = [], []
            if radar or degraded:
                warns = [(t, c) for t, c in radar if "⚠️" in c]
                greens = [c for t, c in radar if "⚠️" not in c]
                dirty = bool(warns) or bool(degraded)
                if len(L) == mid:
                    del L[mid - 3:]   # empty metrics section: no "--- ---" band
                L += ["", "---", ""]
                if greens:
                    # "Awesome" only when nothing is flagged AND nothing was
                    # skipped: a degraded check makes "no tech debt" unearned.
                    lead = "Repo radars clean" if dirty else "Awesome, no tech debt detected"
                    L += [f"<details{OPEN_ALL}>",
                          f"<summary><b>{lead}:</b> {len(greens)} check(s) ✅</summary>", ""]
                    L += [f"- {c}" for c in greens]
                    L += ["", "</details>"]
                if degraded:
                    flat = lambda x: html.escape(" ".join(str(x).split()).replace("|", " ").replace("`", " ")[:300], quote=False)
                    floor = " — the counts above are a floor, not a total" if radar else ""
                    degraded_lines = [f"_⚠️ {len(degraded)} check(s) did not run or ran partially{floor}:_", ""]
                    degraded_lines += [f"- {flat(x)}" for x in degraded[:8]]
                    if len(degraded) > 8:
                        degraded_lines.append(f"- …+{len(degraded) - 8} more")

            # ---- Commit style: a badge at the foot of the report, its commits
            # folded under it. Resolved from the PR's own commits (see the collect
            # step) — this repo has no commitizen hook to ship a verdict.
            def badge(label, msg, color, href):
                src = "https://img.shields.io/static/v1?" + urllib.parse.urlencode(
                    {"label": label, "message": msg, "color": color, "style": "flat"})
                alt = html.escape(f"{label}: {msg}", quote=True)
                return f'<a href="{href}"><img alt="{alt}" src="{src}"></a>'
            CC_URL = "https://www.conventionalcommits.org/"
            cstyle_head, cstyle_block, cstyle_bad = None, [], False
            def commit_rows(commits):
                rows = ["| commit | subject |", "| --- | --- |"]
                for c in commits:
                    subj = str(c.get("subject", "")).replace("|", " ").replace("`", " ").replace("\n", " ")[:120]
                    rows.append(f"| `{c.get('sha', '?')}` | {subj} |")
                return rows
            if cstyle.get("commitstyle_bad"):
                bad = cstyle["commitstyle_bad"]
                total = cstyle.get("commitstyle_total")
                of = f"/{total}" if total else ""
                mg = f" · +{cstyle['commitstyle_merges']} merge not judged" if cstyle.get("commitstyle_merges") else ""
                cstyle_head = badge("Commit style", f"{len(bad)}{of} not conventional{mg}", "important", CC_URL)
                cstyle_bad = True
                # The rule and the fix first — that is what the reader acts on;
                # the offending commits follow as the table.
                cstyle_block = ["These commit messages are not in the best shape.",
                                "",
                                "Please use this format:",
                                "**type(scope): subject — e.g. fix(sizer): round the qty down**",
                                "Type: `build` `ci` `docs` `feat` `fix` `perf` `refactor` `style` `test` `chore` `revert` `bump`",
                                "Scope is one token (no spaces): `tv-alerts`, not `tv alerts`",
                                "Subject has no trailing period",
                                "",
                                "Fix:",
                                "",
                                "```bash",
                                "git rebase -i <base>        # mark the listed commits: reword",
                                "git push --force-with-lease",
                                "```",
                                ""]
                cstyle_block += commit_rows(bad[:50])
            elif cstyle.get("commitstyle_skipped"):
                # Nothing was judged: a note, not a green signature — "all
                # conventional" and "not checked" differ.
                cstyle_head = badge("Commit style", "not judged (" + str(cstyle["commitstyle_skipped"])[:80] + ")", "lightgrey", CC_URL)
            elif cstyle.get("commitstyle_total"):
                t = cstyle["commitstyle_total"]
                mg = f" · +{cstyle['commitstyle_merges']} merge not judged" if cstyle.get("commitstyle_merges") else ""
                cstyle_head = badge("Commit style", f"{t}/{t} conventional{mg}", "success", CC_URL)
                if cstyle.get("commitstyle_commits"):
                    cstyle_block = commit_rows(cstyle["commitstyle_commits"][:50])
            def column(head, rows, open_):
                if not head:
                    return []
                if not rows:
                    return [head, ""]
                return [f"<details{open_}>", f"<summary>{head}</summary>", "", *rows, "", "</details>", ""]
            cols = ["", *column(cstyle_head, cstyle_block, OPEN_TOP if cstyle_bad else OPEN_ALL)] if cstyle_head else []
            footer = ["", f"→ full report: [run Summary]({RUN})"] if RUN else []

            # ---- Folded finding lists: one <details> of at most CAP rows per
            # warning. GitHub caps a comment at 65536 bytes: blocks are added
            # until the budget runs out, the rest is counted in a trailing note.
            # The Summary gets everything.
            LIMIT = 65536 - 1024
            CAP = 50
            def cell(v, n=160):
                return str(v).replace("|", " ").replace("`", " ").replace("\r", " ").replace("\n", " ")[:n]
            def is_dir_row(r):
                return r.startswith("| **")
            def block(title, rows, total, head, tail, icon="⚠️", open_=False):
                shown = sum(1 for r in rows if not is_dir_row(r))
                more = f" — first {shown}" if shown < total else ""
                return ["", f"<details{' open' if open_ else ''}>",
                        f"<summary>{icon} {LABEL.get(title, title)}: {total} finding(s){more}</summary>",
                        "", *head, *rows, *tail, "</details>"]
            # Finding row = "<path>[:<line>[:<col>]]  <rest>" -> two-column table,
            # the location a permalink into the PR head (12-char sha: the budget).
            BLOB = re.sub(r"/blob/([0-9a-f]{40})/$", lambda m: "/blob/" + m[1][:12] + "/", os.environ.get("BLOB_URL", ""))
            LOC = re.compile(r"^(?P<path>(?!/)(?:[\w@%+=.~/-]| (?! ))+)(?::(?P<line>\d+))?(?::\d+)?(?::(?=\s)|(?=  |$))")
            def finding(v):
                return html.escape(cell(v, 200), quote=False)
            def linkify(row):
                row = row.strip()
                if row.startswith("—"):
                    return "—", finding(row[1:].strip()) or "—"
                m = LOC.match(row)
                # A path needs a slash or a dot, unless an explicit ":<line>"
                # follows (Dockerfile:1).
                if not m or not ("/" in m["path"] or "." in m["path"] or m["line"]):
                    return "—", finding(row)
                path, line = m["path"], m["line"]
                text = path + (f":{line}" if line else "")
                url = BLOB + urllib.parse.quote(path, safe="/") + (f"#L{line}" if line else "")
                loc = f"[`{cell(text, 200)}`]({url})" if BLOB else f"`{cell(text, 200)}`"
                return loc, finding(row[m.end():].strip()) or "—"
            TABLE = (["| location | finding |", "| --- | --- |"], [""])
            folds = []
            def fold(title, rows, total, head=TABLE[0], tail=TABLE[1]):
                rows = list(dict.fromkeys(str(r) for r in rows if str(r).strip()))[:CAP]
                out = ["| " + " | ".join(linkify(r)) + " |" for r in rows]
                if total > 0 and out:
                    folds.append((title, out, total, head, tail))
            def F(src, key):
                return (src.get("findings") or {}).get(key) or []

            fold("trivy", F(sec, "trivy"), sec.get("trivy", 0))
            fold("zizmor", F(zz, "zizmor"), zz.get("zizmor", 0))
            fold("pip-audit", F(zz, "pip_audit"), zz.get("pip_audit", 0))
            fold("actionlint", F(al, "actionlint"), al.get("actionlint", 0))
            fold("secrets", F(gl, "secrets"), gl.get("secrets", 0))
            fold("docker", F(dk, "docker"), dk.get("docker_findings", 0))
            for key in ("pyright", "vulture", "deptry", "semgrep"):
                fold(key, F(rad, key), rad.get(key, 0))
            fold("links", F(lnk, "links"), lnk.get("links_broken", 0))
            # Failing tests: a name is not a path, so its own head.
            tf = F(py, "tests")
            if tf:
                TF = (["| test | failure |", "| --- | --- |"], [""])
                tf_rows = []
                for r in tf[:CAP]:
                    nm, _, why = str(r).partition("  ")
                    tf_rows.append(f"| `{cell(nm, 120)}` | {finding(why.strip()) or '—'} |")
                folds.append(("python_tests", tf_rows, max(py.get("tests_failed", 0), len(tf)), *TF))
            # The blocking diff gate first (what the author must fix), the
            # full-tree backlog after it — same shape, own key.
            HK = (["| hook | lines | first finding |", "| --- | ---: | --- |"], [""])
            for key in ("hooks_gate", "hooks"):
                rows = F(hks, key)
                if not rows:
                    continue
                hk_rows = [f"| `{cell(r.get('hook', '?'), 80)}` | {r.get('lines', 0)} | {finding(r.get('first', ''))} |"
                           for r in rows[:CAP]]
                entry = (key, hk_rows, hks.get(key, len(rows)), *HK)
                if key == "hooks_gate":
                    folds.insert(0, entry)   # the one list the author has to act on
                else:
                    folds.append(entry)

            # Failed gates' lists move up next to Gates, whole, before the
            # Summary copy is taken.
            top = [f for f in folds if f[0] in claimed]
            folds = [f for f in folds if f[0] not in claimed]
            if top:
                top_lines = []
                for name, rows, total, head, tail in top:
                    top_lines += block(name, rows, total, head, tail, icon=claimed[name], open_=bool(OPEN_TOP))
                L[top_at:top_at] = top_lines
            # A ⚠️ count whose producer shipped no rows has no fold to carry it.
            orphans = [c for t, c in warns if t not in {f[0] for f in folds}]
            if orphans:
                L.append("**Tech debt:** " + " · ".join(orphans))

            L_summary = list(L)   # the run Summary has no 64k limit
            for name, rows, total, head, tail in folds:
                L_summary += block(name, rows, total, head, tail, open_=bool(OPEN_ALL))
            budget = LIMIT - len("\n".join(L + degraded_lines + cols + footer).encode()) - 512
            omitted = 0
            for name, rows, total, head, tail in folds:
                frame = len("\n".join(block(name, [], total, head, tail)).encode()) + 1
                keep, size = [], 0
                for r in rows:
                    rb = len(r.encode()) + 1
                    if frame + size + rb > budget:
                        break
                    keep.append(r)
                    size += rb
                if not keep:
                    omitted += 1
                    continue
                L += block(name, keep, total, head, tail, open_=bool(OPEN_ALL))
                budget -= frame + size
            if omitted:
                L += ["", f"_…{omitted} finding list(s) did not fit GitHub's comment limit — see the {SUMMARY}._"]
            if degraded_lines:
                L += ["", *degraded_lines]
                L_summary += ["", *degraded_lines]
            L += cols
            L_summary += cols
            L += footer
            L_summary += footer
            body = "\n".join(L)
            summary_body = "\n".join(L_summary)
            # Last resort for a body some other block pushed over the limit: cut
            # whole lines, keep the footer.
            if len(body.encode()) > LIMIT:
                keep, used = [], len("\n".join(["", "_…report truncated to fit GitHub's comment limit._"] + footer).encode()) + 64
                for line in L:
                    lb = len(line.encode()) + 1
                    if used + lb > LIMIT:
                        break
                    keep.append(line)
                    used += lb
                body = "\n".join(keep + ["", "_…report truncated to fit GitHub's comment limit._"] + footer)

            # The report always goes to the run Summary, every list open; the
            # sticky comment below needs a PR.
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                f.write(summary_body.replace(marker, "").replace("<details>", "<details open>").lstrip() + "\n")

            repo = os.environ["GITHUB_REPOSITORY"]
            pr = os.environ.get("PR_NUMBER", "")
            token = os.environ["GH_TOKEN"]
            if not pr:
                print("::notice::no PR associated with this commit — report written to the run Summary only")
                raise SystemExit(0)

            def req(url, method="GET", data=None):
                r = urllib.request.Request(url, method=method, headers={
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/vnd.github+json",
                    "User-Agent": "bybit-tv-sizer-ci"})
                if data is not None:
                    r.data = json.dumps(data).encode()
                with urllib.request.urlopen(r) as resp:
                    return json.load(resp) if resp.length != 0 else None

            def gql(query, variables):
                r = urllib.request.Request("https://api.github.com/graphql", method="POST", headers={
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/vnd.github+json",
                    "User-Agent": "bybit-tv-sizer-ci"})
                r.data = json.dumps({"query": query, "variables": variables}).encode()
                with urllib.request.urlopen(r) as resp:
                    return json.load(resp)

            try:
                # Stale-run guard: a slow older run must not fold the newer report
                # and leave an obsolete verdict as the bottom comment.
                head = os.environ.get("HEAD_SHA", "")
                live = req(f"https://api.github.com/repos/{repo}/pulls/{pr}")
                cur = live.get("head", {}).get("sha", "")
                if head and cur and head != cur:
                    print(f"::notice::skipping report: run is for {head[:7]}, PR head moved to {cur[:7]}")
                    raise SystemExit(0)
                if live.get("state") != "open":
                    print(f"::notice::skipping report: PR #{pr} is {live.get('state')}")
                    raise SystemExit(0)
                # Fold every previous report as OUTDATED; the current one lands at
                # the BOTTOM. Only comments a bot authored — never a participant's
                # that quotes the marker.
                page, stale = 1, []
                while True:
                    cs = req(f"https://api.github.com/repos/{repo}/issues/{pr}/comments?per_page=100&page={page}")
                    stale += [c["node_id"] for c in cs
                              if marker in (c.get("body") or "")
                              and ((c.get("user") or {}).get("login") or "").endswith("[bot]")]
                    if len(cs) < 100:
                        break
                    page += 1
                # Skip comments already folded (quadratic GraphQL churn otherwise).
                if stale:
                    try:
                        q = "query($ids:[ID!]!){nodes(ids:$ids){... on IssueComment{id isMinimized}}}"
                        state = {}
                        for i in range(0, len(stale), 100):
                            resp = gql(q, {"ids": stale[i:i + 100]})
                            for item in (resp.get("data") or {}).get("nodes") or []:
                                if item:
                                    state[item["id"]] = item.get("isMinimized", False)
                        stale = [nid for nid in stale if not state.get(nid, False)]
                    except Exception as le:
                        print(f"::warning::minimized-state lookup failed ({le}) — folding all candidates")
                folded = 0
                for nid in stale:
                    # GraphQL reports mutation failures inside a 200 response —
                    # count a fold only when isMinimized is confirmed.
                    try:
                        resp = gql("mutation($id:ID!){minimizeComment(input:{subjectId:$id,classifier:OUTDATED})"
                                   "{minimizedComment{isMinimized}}}", {"id": nid})
                        ok = (not resp.get("errors")) and (resp.get("data") or {}).get(
                            "minimizeComment", {}).get("minimizedComment", {}).get("isMinimized")
                        if ok:
                            folded += 1
                        else:
                            print(f"::warning::could not minimize old report {nid}: {resp.get('errors')}")
                    except Exception as me:
                        print(f"::warning::could not minimize old report {nid}: {me}")
                req(f"https://api.github.com/repos/{repo}/issues/{pr}/comments", "POST", {"body": body})
                print(f"posted the report (minimized {folded}/{len(stale)} outdated)")
            except SystemExit:
                pass
            except Exception as e:
                print(f"::warning::could not post the CI report ({e})")
        run: |
          set -e
          # Per-job scratch under RUNNER_TEMP.
          CIM="${RUNNER_TEMP:-/tmp}/cim"; export CIM
          rm -rf "${CIM}" && mkdir -p "${CIM}"

          # A pull_request run carries the number; a push resolves it from the
          # commit, and reports to the Summary alone when there is none.
          if [ -z "${PR_NUMBER:-}" ]; then
            PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls?per_page=1" \
              -q '.[0].number // empty' 2>/dev/null || true)
          fi
          export PR_NUMBER

          # fetch <out> <api path...>: 3 attempts; a miss is named in the report,
          # never silent.
          fetch() {
            local out=$1; shift; local n
            for n in 1 2 3; do
              if gh api "$@" > "$out" 2> "${CIM}"/fetch.err; then return 0; fi
              [ "$n" -lt 3 ] && sleep $((n * 10))
            done
            return 1
          }
          : > "${CIM}"/missing.txt

          # The CI run's own metrics artifacts.
          if fetch "${CIM}"/artifacts.json "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100"; then
            jq -r '.artifacts[] | select(.name | startswith("ci-metrics-")) | "\(.id) \(.name)"' "${CIM}"/artifacts.json \
            | while read -r id name; do
                if fetch "${CIM}/$name.zip" "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
                   && unzip -o -q "${CIM}/$name.zip" -d "${CIM}/$name"; then continue; fi
                echo "::warning::ci-report: could not fetch artifact $name (id $id) after 3 attempts"
                echo "$name" >> "${CIM}"/missing.txt
              done
          else
            echo "::warning::ci-report: could not list the run's artifacts after 3 attempts"
            echo "artifact list" >> "${CIM}"/missing.txt
          fi

          # Delta baseline: the newest tests artifact of the last green CI run on
          # the default branch.
          base_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$DEFAULT_BRANCH&status=success&per_page=1" \
            -q '.workflow_runs[0].id' 2>/dev/null) || true
          if [ -n "$base_run" ] && [ "$base_run" != "null" ]; then
            bid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$base_run/artifacts?per_page=100" \
              -q '[.artifacts[] | select(.name | startswith("ci-metrics-python-"))] | sort_by(.name) | last | .id' 2>/dev/null) || true
            if [ -n "$bid" ] && [ "$bid" != "null" ]; then
              fetch "${CIM}"/base.zip "repos/$GITHUB_REPOSITORY/actions/artifacts/$bid/zip" \
                && unzip -o -q "${CIM}"/base.zip -d "${CIM}"/base 2>/dev/null || true
            fi
          fi

          # Commit style, judged here: this repo has no commitizen hook to ship a
          # verdict with the other metrics. Merges are not judged (git writes
          # their subject), but they are counted so the total reconciles with the
          # PR's commit count.
          if [ -n "$PR_NUMBER" ]; then
            if fetch "${CIM}"/commits.json "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100"; then
              python3 - <<'PYEOF' || true
          import json, os, re
          CIM = os.environ["CIM"]
          TYPES = "build|ci|docs|feat|fix|perf|refactor|style|test|chore|revert|bump"
          RX = re.compile(rf"^(?:{TYPES})(?:\([^\s()]+\))?!?: .+[^.]$")
          commits = json.load(open(f"{CIM}/commits.json"))
          judged, bad, merges = [], [], 0
          for c in commits:
              subject = (c.get("commit", {}).get("message") or "").split("\n")[0].strip()
              row = {"sha": (c.get("sha") or "")[:7], "subject": subject}
              if len(c.get("parents") or []) > 1:
                  merges += 1
                  continue
              judged.append(row)
              if not RX.match(subject):
                  bad.append(row)
          out = {"commitstyle_total": len(judged), "commitstyle_merges": merges,
                 "commitstyle_commits": judged[:50]}
          if bad:
              out["commitstyle_bad"] = bad
          if not judged:
              out = {"commitstyle_skipped": "no non-merge commit in the PR", "commitstyle_merges": merges}
          json.dump(out, open(f"{CIM}/commitstyle.json", "w"))
          PYEOF
            fi
          fi

          # The CI run's job conclusions and failed step names.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            -q '[.jobs[] | {name, conclusion, steps: [.steps[] | select(.conclusion=="failure") | .name]}]' \
            > "${CIM}"/jobs.json || echo '[]' > "${CIM}"/jobs.json

          # The composer rides in a step env value, not in this run: script.
          # actionlint pipes every `run:` to shellcheck through a pipe and
          # deadlocks once the script crosses ~64 KiB.
          py="${CIM}/report.py"
          printf '%s\n' "$REPORT_PY" > "$py"
          python3 "$py"
