sonar.projectKey=wansiedler_bybit-tv-sizer
sonar.organization=wansiedler

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=test_*.py,conftest.py
sonar.exclusions=.venv/**,session/**,build/**,dist/**
sonar.python.version=3.12,3.13,3.14

# Written by the pytest step right before the scan.
sonar.python.coverage.reportPaths=coverage.xml
