# Ruff config lives in ruff.toml; this file carries mypy and pytest.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true   # telethon ships no stubs
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["."]
# Branch coverage too: "every line ran" is a weaker claim than "every
# decision went both ways", and the suite meets the stronger one.
branch = true
omit = [
    "test_*.py",
    ".venv/*",
    "session/*",
]

[tool.coverage.report]
# The suite covers every line of every shipped file. Anything less is a
# regression, so the floor is the ceiling.
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
