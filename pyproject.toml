# Ruff config lives in ruff.toml; this file carries mypy and pytest.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true   # telethon ships no stubs
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["."]
# chat_id.py and setup_env.py are one-shot setup scripts run by a human once;
# measuring them only drags the number down without saying anything useful.
omit = [
    "test_*.py",
    "chat_id.py",
    "setup_env.py",
    ".venv/*",
    "session/*",
]

[tool.coverage.report]
# Floor, not a target: it stops coverage sliding backwards. Raise it as
# tests land; relay.py is the untested half today.
fail_under = 14
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
